<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Narrative & Concept</title>
    <style>
        /* Force 100% transparency and perfectly center all content */
        html, body {
            background: transparent !important;
            background-color: transparent !important;
            color: #fdfbf7; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 10px;
            margin: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .content-container {
            background: transparent !important; 
            border: none;
            box-shadow: none;
            backdrop-filter: none;
            padding: 20px;
            text-align: center; 
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            color: #fdfbf7;
            margin-bottom: 25px;
            font-size: 2rem;
            letter-spacing: 1px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
        }

        /* Slider Layout */
        .slider-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        .slide-image {
            width: 100%;
            max-width: 900px;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            /* Updated transparency to 0.6 */
            opacity: 0.6; 
        }

        /* Navigation Arrows */
        .nav-arrow {
            background: rgba(225, 235, 222, 0.4); 
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #0b170c;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 15px 20px;
            cursor: pointer;
            border-radius: 8px;
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-arrow:hover:not(:disabled) {
            background: rgba(168, 191, 161, 0.8);
            transform: scale(1.05);
        }

        .nav-arrow:disabled {
            opacity: 0.2;
            cursor: not-allowed;
            background: rgba(225, 235, 222, 0.1); 
        }
    </style>
</head>
<body>

    <div class="content-container">
        <h2>Design Narrative & Concept</h2>
        
        <div class="slider-wrapper">
            <button id="left-btn" class="nav-arrow" onclick="moveSlide(-1)">&#10094;</button>
            
            <img id="slide-img" class="slide-image" src="" alt="Presentation Slide">
            
            <button id="right-btn" class="nav-arrow" onclick="moveSlide(1)">&#10095;</button>
        </div>
    </div>

    <script>
        const slides = [
            'design-narrative-01.png',
            'design-narrative-02.png',
            'design-narrative-03.png'
        ];
        
        let currentIndex = 0;
        
        const slideImg = document.getElementById('slide-img');
        const leftBtn = document.getElementById('left-btn');
        const rightBtn = document.getElementById('right-btn');

        function updateSlider() {
            slideImg.src = slides[currentIndex];
            leftBtn.disabled = currentIndex === 0;
            rightBtn.disabled = currentIndex === (slides.length - 1);
        }

        function moveSlide(direction) {
            const newIndex = currentIndex + direction;
            if (newIndex >= 0 && newIndex < slides.length) {
                currentIndex = newIndex;
                updateSlider();
            }
        }

        updateSlider();
    </script>
</body>
</html>
