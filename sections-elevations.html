<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Key Sections & Elevations</title>
    <style>
        /* Transparent body */
        html, body {
            background: transparent !important; 
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; 
        }

        /* Container for drag and click interactions */
        .img-container {
            width: 95vw;
            height: 95vh;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
        }

        .img-container:active {
            cursor: grabbing;
        }

        /* The floating image */
        #plan-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.2s ease-out;
            transform-origin: center center;
        }

        /* Top View Switcher Buttons */
        .floor-controls {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .floor-btn {
            background: transparent; /* Fully transparent background */
            border: 1px solid rgba(255, 255, 255, 0.5); /* Crisp outline */
            color: #fdfbf7;
            padding: 12px 25px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            /* Strong text shadow ensures readability over the video */
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .floor-btn.active, .floor-btn:hover {
            background: rgba(168, 191, 161, 0.25); /* Very faint green tint when active */
            color: #fdfbf7;
            border-color: rgba(255, 255, 255, 0.9);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        /* Floating central bottom controls (+ / -) */
        .zoom-controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            background: transparent; /* Fully transparent */
            padding: 5px 25px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            z-index: 100;
        }

        .ctrl-btn {
            background: transparent;
            color: #fff;
            border: none;
            font-size: 28px;
            font-weight: 300;
            cursor: pointer;
            width: 35px;
            height: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.9);
            transition: background 0.2s ease;
        }

        .ctrl-btn:hover {
            background: rgba(168, 191, 161, 0.3); 
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .floor-controls {
                width: 90%;
                justify-content: center;
                gap: 10px;
            }
            .floor-btn {
                padding: 10px 15px;
                font-size: 0.95rem;
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <!-- Top View Selection Navigation -->
    <div class="floor-controls">
        <button class="floor-btn active" id="btn-view1" onclick="switchFloor('Section01.png', 'btn-view1')">View 01</button>
        <button class="floor-btn" id="btn-view2" onclick="switchFloor('Section02.png', 'btn-view2')">View 02</button>
    </div>

    <!-- Container acts as the touch/drag target -->
    <div class="img-container" id="container">
        <!-- Default loaded image -->
        <img src="Section01.png" id="plan-img" alt="Section View 01">
    </div>

    <!-- Minimalist +/- Buttons -->
    <div class="zoom-controls">
        <button class="ctrl-btn" onclick="zoom(-0.25)" title="Zoom Out">−</button>
        <button class="ctrl-btn" onclick="zoom(0.25)" title="Zoom In">+</button>
    </div>

    <script>
        const img = document.getElementById('plan-img');
        const container = document.getElementById('container');
        
        // State variables for Zoom and Pan
        let scale = 1;
        let posX = 0;
        let posY = 0;
        
        let isDragging = false;
        let startX, startY;

        // Function to switch images and reset zoom/pan
        function switchFloor(imageSrc, buttonId) {
            // Update Image
            img.src = imageSrc;
            
            // Reset Zoom and Pan
            scale = 1;
            posX = 0;
            posY = 0;
            updateTransform();

            // Update Active Button Styles
            document.querySelectorAll('.floor-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(buttonId).classList.add('active');
        }

        // Applies the transformation to the image
        function updateTransform() {
            img.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
        }

        // Handles zoom via buttons and mouse wheel
        function zoom(delta) {
            scale += delta;
            
            // Constrain zoom levels
            if (scale <= 1) { 
                scale = 1; 
                posX = 0; 
                posY = 0; 
            }
            if (scale > 5) scale = 5; 
            
            img.style.transition = 'transform 0.2s ease-out';
            updateTransform();
        }

        // Mouse Wheel Zoom Listener
        window.addEventListener('wheel', (e) => {
            e.preventDefault(); 
            const delta = e.deltaY < 0 ? 0.25 : -0.25;
            zoom(delta);
        }, { passive: false });

        // --- Drag to Pan Functionality ---
        
        container.addEventListener('mousedown', (e) => {
            if (scale === 1) return; 
            isDragging = true;
            startX = e.clientX - posX;
            startY = e.clientY - posY;
            img.style.transition = 'none'; 
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            posX = e.clientX - startX;
            posY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => { isDragging = false; });
        window.addEventListener('mouseleave', () => { isDragging = false; });

        // Touch Events for Mobile/Tablet
        container.addEventListener('touchstart', (e) => {
            if (scale === 1) return;
            isDragging = true;
            startX = e.touches[0].clientX - posX;
            startY = e.touches[0].clientY - posY;
            img.style.transition = 'none';
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            posX = e.touches[0].clientX - startX;
            posY = e.touches[0].clientY - startY;
            updateTransform();
        }, { passive: true });

        window.addEventListener('touchend', () => { isDragging = false; });

        // --- Click Outside to Go Home ---
        document.body.addEventListener('click', function(event) {
            if (event.target === document.body || event.target === container) {
                if (window.parent && window.parent.triggerHomeEffect) {
                    window.parent.triggerHomeEffect();
                }
            }
        });
    </script>
</body>
</html>
