<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neighbourhood Park Preliminary Design Masterplan</title>
    <style>
        /* Transparent body - removes the dark dimming box */
        html, body {
            background: transparent !important; 
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Strictly removes scrollbars */
        }

        /* Container for drag and click interactions */
        .img-container {
            width: 95vw;
            height: 95vh;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
        }

        .img-container:active {
            cursor: grabbing;
        }

        /* The floating image */
        #plan-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            /* Strong shadow to make it float over the transparent background */
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            /* Transform handles panning and zooming smoothly */
            transition: transform 0.2s ease-out;
            transform-origin: center center;
        }

        /* Floating central bottom controls */
        .zoom-controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            background: rgba(26, 31, 27, 0.75);
            padding: 5px 25px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            z-index: 100;
        }

        .ctrl-btn {
            background: transparent;
            color: #fff;
            border: none;
            font-size: 28px;
            font-weight: 300;
            cursor: pointer;
            width: 35px;
            height: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            transition: background 0.2s ease;
        }

        .ctrl-btn:hover {
            background: rgba(168, 191, 161, 0.4); /* Subtle theme green highlight */
        }
    </style>
</head>
<body>

    <!-- Container acts as the touch/drag target -->
    <div class="img-container" id="container">
        <img src="Masterplan.png" id="plan-img" alt="Masterplan">
    </div>

    <!-- Minimalist +/- Buttons -->
    <div class="zoom-controls">
        <button class="ctrl-btn" onclick="zoom(-0.25)" title="Zoom Out">−</button>
        <button class="ctrl-btn" onclick="zoom(0.25)" title="Zoom In">+</button>
    </div>

    <script>
        const img = document.getElementById('plan-img');
        const container = document.getElementById('container');
        
        // State variables for Zoom and Pan
        let scale = 1;
        let posX = 0;
        let posY = 0;
        
        let isDragging = false;
        let startX, startY;

        // Applies the transformation to the image
        function updateTransform() {
            img.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
        }

        // Handles zoom via buttons and mouse wheel
        function zoom(delta) {
            scale += delta;
            
            // Constrain zoom levels
            if (scale <= 1) { 
                scale = 1; 
                posX = 0; // Snap back to center when fully zoomed out
                posY = 0; 
            }
            if (scale > 5) scale = 5; // Max 5x zoom
            
            img.style.transition = 'transform 0.2s ease-out';
            updateTransform();
        }

        // Mouse Wheel Zoom Listener
        window.addEventListener('wheel', (e) => {
            e.preventDefault(); // Prevents accidental page scrolling
            const delta = e.deltaY < 0 ? 0.25 : -0.25;
            zoom(delta);
        }, { passive: false });

        // --- Drag to Pan Functionality ---
        
        // Mouse Events
        container.addEventListener('mousedown', (e) => {
            if (scale === 1) return; // Only allow panning if zoomed in
            isDragging = true;
            startX = e.clientX - posX;
            startY = e.clientY - posY;
            img.style.transition = 'none'; // Instant movement while dragging
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            posX = e.clientX - startX;
            posY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => { isDragging = false; });
        window.addEventListener('mouseleave', () => { isDragging = false; });

        // Touch Events for Mobile/Tablet
        container.addEventListener('touchstart', (e) => {
            if (scale === 1) return;
            isDragging = true;
            startX = e.touches[0].clientX - posX;
            startY = e.touches[0].clientY - posY;
            img.style.transition = 'none';
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            posX = e.touches[0].clientX - startX;
            posY = e.touches[0].clientY - startY;
            updateTransform();
        }, { passive: true });

        window.addEventListener('touchend', () => { isDragging = false; });

        // --- Click Outside to Go Home ---
        document.body.addEventListener('click', function(event) {
            // Trigger home ONLY if clicking the transparent container/body, not the image or buttons
            if (event.target === document.body || event.target === container) {
                if (window.parent && window.parent.triggerHomeEffect) {
                    window.parent.triggerHomeEffect();
                }
            }
        });
    </script>
</body>
</html>
